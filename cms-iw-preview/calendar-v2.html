<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CMS IW — Calendar</title><style>
:root{--body:16pt;--compact:14pt;--ink:#151717;--muted:#676e69;--canvas:#e9ece8;--surface:#fff;--line:#d9ddd8;--line2:#c8cdc7;--accent:#b7ff3c;--graphite:#202321;--youtube:#ff0033;--linkedin:#0a66c2;--tiktok:#111;--instagram:#c13584;--facebook:#1877f2;--telegram:#229ed9;--vk:#07f;--x:#111}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:var(--body);line-height:1.45;color:var(--ink);background:var(--canvas)}button{font:inherit;cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:78px 350px minmax(0,1fr)}.rail{position:sticky;top:0;height:100vh;background:#171918;padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:10px}.mark{width:54px;height:54px;border-radius:16px;background:var(--accent);display:grid;place-items:center;font-weight:900}.rail button{width:54px;height:54px;border:0;border-radius:14px;background:transparent;color:#a8aea9}.rail button.active{background:#303430;color:var(--accent)}.spacer{flex:1}.sidebar{position:sticky;top:0;height:100vh;background:#f8faf7;border-right:1px solid var(--line2);padding:26px 22px;display:flex;flex-direction:column}.eyebrow{font-weight:800;letter-spacing:.07em;color:#858c86}.workspace{font-size:20pt;font-weight:850;margin-top:5px}.hero{margin:20px 0 24px;border:1px solid #b9db7e;background:#f4ffe1;border-radius:16px;padding:14px;font-weight:800;text-align:left}.section{color:#858c86;font-weight:800;margin:0 8px 8px}.nav{display:grid;gap:6px}.nav a{min-height:54px;border-radius:13px;padding:11px 13px;color:#303431;text-decoration:none;display:flex;align-items:center;gap:12px;font-weight:700}.nav a.active{background:#e3e7e2;box-shadow:inset 4px 0 var(--accent)}.profile{margin-top:auto;border:1px solid var(--line2);border-radius:16px;background:#fff;padding:14px}.main{min-width:0;width:100%}.topbar{min-height:88px;border-bottom:1px solid var(--line2);display:flex;align-items:center;justify-content:space-between;padding:14px 34px;background:rgba(233,236,232,.92);position:sticky;top:0;z-index:5}.btn{min-height:54px;border:1px solid var(--line2);border-radius:14px;background:#fff;padding:0 16px;font-weight:800}.btn.primary{background:var(--accent)}.view{width:100%;padding:34px 34px 70px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}.head h1{font-size:34pt;line-height:1.04;letter-spacing:-.045em;margin:0}.head p{margin:8px 0 0;color:var(--muted)}.pill,.provider,.status,.format{font-size:var(--compact);line-height:1.15;border-radius:999px;padding:6px 9px;display:inline-flex;align-items:center;gap:6px}.pill{border:1px solid var(--line2);background:#fff}.provider.youtube{background:#fff0f1;color:#c51b1b}.provider.linkedin{background:#edf5ff;color:#0a66c2}.provider.tiktok{background:#eee}.provider.instagram{background:#fff0fa;color:#a52a77}.provider.facebook{background:#eef3ff;color:#2854b9}.provider.telegram{background:#eef8ff;color:#2481cc}.provider.vk{background:#edf5ff;color:#07f}.provider.x{background:#111;color:#fff}.status{background:#eff1ef}.status.published{background:#e6f8d4;color:#426524}.status.scheduled{background:#e9f2ff;color:#315f91}.status.review{background:#fff2d4;color:#805d08}.format{border:1px solid var(--line);background:#fff}.toolbar{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.navperiod,.views,.filters{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.toolbar button,.filters button{min-height:54px;border:1px solid var(--line2);background:#fff;border-radius:14px;padding:0 14px;font-weight:800}.views button.active,.filters button.active{background:var(--graphite);color:#fff}.filters{margin-bottom:16px}.filters button.all.active{background:var(--accent);color:#111;border-color:#a3d947}.filters button{display:flex;align-items:center;gap:8px}.period{min-width:220px;text-align:center;font-weight:800}.frame{border:1px solid var(--line2);border-radius:18px;background:#fff;overflow-x:auto}.weekdays,.month{display:grid;grid-template-columns:repeat(7,minmax(205px,1fr));min-width:1435px}.weekdays{background:#f0f3ef;border-bottom:1px solid var(--line2)}.weekday{padding:13px 14px;font-weight:800;color:var(--muted);text-transform:uppercase}.day{min-height:190px;padding:12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px;overflow:visible}.day:nth-child(7n){border-right:0}.day.other{background:#f7f8f6}.day.today{box-shadow:inset 0 0 0 2px var(--accent)}.dayhead{display:flex;justify-content:space-between;align-items:center}.count{font-size:var(--compact);background:#eef1ed;border-radius:999px;padding:4px 7px;color:var(--muted)}.stack{display:flex;flex-direction:column;gap:8px;overflow:visible}.card{border:1px solid var(--line);border-left:5px solid var(--brand,#777);border-radius:12px;background:#fbfcfa;padding:9px 10px;display:grid;gap:7px;overflow:visible}.card.youtube{--brand:var(--youtube)}.card.linkedin{--brand:var(--linkedin)}.card.tiktok{--brand:var(--tiktok)}.card.instagram{--brand:var(--instagram)}.card.facebook{--brand:var(--facebook)}.card.telegram{--brand:var(--telegram)}.card.vk{--brand:var(--vk)}.card.x{--brand:var(--x)}.card.published{background:#f4faec}.card.scheduled{background:#f6f9ff}.card.review{background:#fff9ec}.cardtop,.cardmeta{display:flex;justify-content:space-between;gap:7px;align-items:center;flex-wrap:wrap}.cardtitle{font-weight:800;line-height:1.25;overflow-wrap:anywhere}.time{color:var(--muted)}.week{display:grid;grid-template-columns:repeat(7,minmax(240px,1fr));gap:10px;overflow-x:auto}.weekcol{border:1px solid var(--line2);border-radius:16px;background:#fff;overflow:visible}.weekhead{padding:14px;border-bottom:1px solid var(--line);background:#f1f3f0}.weekstack{padding:10px;display:grid;gap:8px}.dayview{display:grid;gap:12px}.timerow{display:grid;grid-template-columns:100px minmax(0,1fr);gap:14px;align-items:start}.timerow>strong{padding-top:12px}.hidden{display:none!important}@media(max-width:900px){.app{grid-template-columns:68px minmax(0,1fr)}.sidebar{display:none}.view{padding:24px 18px 50px}.head{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="app"><aside class="rail"><div class="mark">IW</div><button>⌂</button><button>▤</button><button>⌁</button><button class="active">□</button><button>↑</button><button>◇</button><div class="spacer"></div><button>⚙</button></aside><aside class="sidebar"><div class="eyebrow">CONTENT SYSTEM</div><div class="workspace">IntraWeb 17</div><button class="hero">✦ &nbsp; Hero Setup</button><div class="section">Workspace</div><nav class="nav"><a href="./">⌂ Dashboard</a><a href="./#/content">▤ Content Library</a><a href="./analytics.html">⌁ Analytics</a><a class="active" href="./calendar-v2.html">□ Calendar</a><a href="./#/publisher">↑ Publisher</a><a href="./#/knowledge">◇ Knowledge Base</a></nav><div class="profile"><strong>Profile</strong><br>Workspace administrator</div></aside><main class="main"><header class="topbar"><div>CMS IW / <strong>Calendar</strong></div><button class="btn primary">＋ New content</button></header><section class="view"><div class="head"><div><h1>Content calendar</h1><p>Published and upcoming posts. Filters can be combined; All is selected by default.</p></div><span class="pill" id="visibleCount"></span></div><div class="toolbar"><div class="navperiod"><button id="prev">‹</button><span class="period" id="period">August 2026</span><button id="next">›</button><button id="today">Today</button></div><div class="views"><button data-view="month" class="active">Month</button><button data-view="week">Week</button><button data-view="day">Day</button></div></div><div class="filters" id="filters"></div><div id="calendar"></div></section></main></div><script>
const providers={youtube:['▶','YouTube'],linkedin:['in','LinkedIn'],tiktok:['♪','TikTok'],instagram:['◎','Instagram'],facebook:['f','Facebook'],telegram:['➤','Telegram'],vk:['VK','VK'],x:['X','X']};
const posts=[
 {title:'Migration checklist',provider:'x',status:'published',date:'2026-08-05',time:'09:30',format:'Post'},
 {title:'IntraWeb 17 FE — first look',provider:'youtube',status:'published',date:'2026-08-06',time:'11:00',format:'Long video'},
 {title:'Release notes digest',provider:'linkedin',status:'published',date:'2026-08-10',time:'10:15',format:'Post'},
 {title:'Community quick tip',provider:'telegram',status:'published',date:'2026-08-10',time:'13:10',format:'Post'},
 {title:'Weekly update',provider:'linkedin',status:'review',date:'2026-08-11',time:'10:00',format:'Post'},
 {title:'Developer note',provider:'telegram',status:'review',date:'2026-08-11',time:'15:30',format:'Post'},
 {title:'Responsive form layout',provider:'youtube',status:'scheduled',date:'2026-08-12',time:'12:30',format:'Short'},
 {title:'Responsive form layout',provider:'instagram',status:'scheduled',date:'2026-08-12',time:'14:00',format:'Reel'},
 {title:'Responsive form layout',provider:'tiktok',status:'scheduled',date:'2026-08-12',time:'16:30',format:'Short'},
 {title:'Rendering performance explained',provider:'facebook',status:'scheduled',date:'2026-08-14',time:'11:15',format:'Image post'},
 {title:'Customer project showcase',provider:'vk',status:'scheduled',date:'2026-08-15',time:'12:00',format:'Video'},
 {title:'Release thread',provider:'x',status:'scheduled',date:'2026-08-15',time:'15:45',format:'Post'}
];
const order=['youtube','linkedin','tiktok','instagram','facebook','telegram','vk','x'], weekdays=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];let selected=new Set(),view='month',cursor=new Date(2026,7,10);
const badge=p=>`<span class="provider ${p}">${providers[p][0]} ${providers[p][1]}</span>`;const status=s=>`<span class="status ${s}">${s}</span>`;const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;function monday(d){const x=new Date(d),n=(x.getDay()+6)%7;x.setDate(x.getDate()-n);return x}function visible(){return posts.filter(p=>!selected.size||selected.has(p.provider))}function card(p){return `<article class="card ${p.provider} ${p.status}"><div class="cardtop">${badge(p.provider)}${status(p.status)}</div><div class="cardtitle">${p.title}</div><div class="cardmeta"><span class="time">${p.time}</span><span class="format">${p.format}</span></div></article>`}function renderFilters(){document.getElementById('filters').innerHTML=`<button class="all ${!selected.size?'active':''}" data-p="all">All</button>`+order.map(p=>`<button data-p="${p}" class="${selected.has(p)?'active':''}">${badge(p)}</button>`).join('');document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const p=b.dataset.p;if(p==='all')selected.clear();else if(!selected.size)selected.add(p);else if(selected.has(p))selected.delete(p);else selected.add(p);render()})}function month(){const first=new Date(cursor.getFullYear(),cursor.getMonth(),1),start=monday(first),days=[];for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);days.push(d)}const rows=visible();return `<div class="frame"><div class="weekdays">${weekdays.map(w=>`<div class="weekday">${w}</div>`).join('')}</div><div class="month">${days.map(d=>{const ps=rows.filter(p=>p.date===key(d));return `<section class="day ${d.getMonth()!==cursor.getMonth()?'other':''}"><div class="dayhead"><strong>${d.getDate()}</strong>${ps.length>1?`<span class="count">${ps.length} posts</span>`:''}</div><div class="stack">${ps.map(card).join('')}</div></section>`}).join('')}</div></div>`}function week(){const s=monday(cursor),rows=visible();return `<div class="week">${weekdays.map((w,i)=>{const d=new Date(s);d.setDate(s.getDate()+i);const ps=rows.filter(p=>p.date===key(d));return `<section class="weekcol"><div class="weekhead"><strong>${w}</strong><br>${d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div><div class="weekstack">${ps.length?ps.map(card).join(''):'No posts'}</div></section>`}).join('')}</div>`}function day(){const ps=visible().filter(p=>p.date===key(cursor));return `<div class="dayview">${ps.length?ps.map(p=>`<div class="timerow"><strong>${p.time}</strong>${card(p)}</div>`).join(''):'No posts for this day.'}</div>`}function render(){renderFilters();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.getElementById('period').textContent=view==='month'?cursor.toLocaleDateString('en-US',{month:'long',year:'numeric'}):view==='week'?`${monday(cursor).toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${new Date(monday(cursor).setDate(monday(cursor).getDate()+6)).toLocaleDateString('en-US',{month:'short',day:'numeric'})}`:cursor.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});document.getElementById('visibleCount').textContent=`${visible().length} visible posts`;document.getElementById('calendar').innerHTML=view==='month'?month():view==='week'?week():day()}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.getElementById('prev').onclick=()=>{if(view==='month')cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);else{const d=new Date(cursor);d.setDate(d.getDate()-(view==='week'?7:1));cursor=d}render()};document.getElementById('next').onclick=()=>{if(view==='month')cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);else{const d=new Date(cursor);d.setDate(d.getDate()+(view==='week'?7:1));cursor=d}render()};document.getElementById('today').onclick=()=>{cursor=new Date(2026,7,10);render()};render();
</script></body></html>
