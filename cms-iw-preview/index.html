rmat('en-US',{hour:'numeric',minute:'2-digit'}).format(new Date(v));const badge=p=>`<span class="provider ${p}">${providers[p]?.[0]||p} ${providers[p]?.[1]||p}</span>`;const head=(t,p,m='')=>`<div class="page-head"><div><h1>${t}</h1><p>${p}</p></div>${m?`<div>${m}</div>`:''}</div>`;const defs=[['dashboard','⌂','Dashboard'],['content','▤','Content & Analytics'],['calendar','□','Calendar'],['publisher','↑','Publisher'],['knowledge','◇','Knowledge Base']];function nav(){sideNav.innerHTML=defs.map(([r,i,l])=>`<button data-route="${r}" class="${current===r?'active':''}"><span>${i}</span><span>${l}</span></button>`).join('');railNav.innerHTML=defs.map(([r,i])=>`<button data-route="${r}" class="${current===r?'active':''}">${i}</button>`).join('');document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{current=b.dataset.route;render()});heroBtn.classList.toggle('active',current==='hero');crumb.textContent={dashboard:'Dashboard',content:'Content & Analytics',calendar:'Calendar',publisher:'Publisher',knowledge:'Knowledge Base',hero:'Hero Setup',settings:'Settings'}[current]||'Dashboard'}function dashboard(){const cards=[];if(widgets.has('library'))cards.push(['Content library',content.length,'complete history']);if(widgets.has('queue'))cards.push(['Publisher queue',content.filter(x=>['review','scheduled'].includes(x.status)).length,'needs action / scheduled']);if(widgets.has('views'))cards.push(['Views synced',4830,'current output snapshots']);if(widgets.has('knowledge'))cards.push(['Knowledge inputs',knowledge.length,'manual + parsed']);if(widgets.has('sources'))cards.push(['Active collectors',4,'internal / external']);return head('Dashboard','A configurable overview assembled from the modules you choose.','<button class="btn" id="configDash">Configure dashboard</button>')+`<div class="widgets">${cards.map(x=>`<div class="widget"><span>${x[0]}</span><b>${n(x[1])}</b><small>${x[2]}</small></div>`).join('')}</div>${widgets.has('coverage')?`<div class="grid2"><secti function contentView(){return head('Content & Analytics','All content history, linked media references and publication results in one filtered dataset.','<span class="pill accent">6 records</span>')+`<div class="filters"><label class="wide"><span>Search</span><input id="q" placeholder="Title, text, theme…"></label><label><span>Period</span><select id="period"><option>Any period</option><option>Last 7 days</option><option>August 2026</option><option>Custom range…</option></select></label><label><span>Channel</span><select id="channelFilter"><option value="all">All channels</option>${channels.map(c=>`<option value="${c[0]}">${c[1]}</option>`).join('')}</select></label><label><span>Theme</span><select id="themeFilter"><option value="all">All themes</option>${themes.map(t=>`<option>${t}</option>`).join('')}</select></label><label><span>Format</span><select><option>All formats</option>${Object.values(fmt).map(v=>`<option>${v}</option>`).join('')}</select></label><label><span>Status</span><select><option>All statuses</option><option>Published</option><option>Scheduled</option><option>Review</option><option>Draft</option></select></label></div><div class="kpis">${[['Published posts',1],['Views',4830],['Reach',6120],['Likes',247],['Shares',44]].map(x=>`<div class="kpi"><span>${x[0]}</span><b>${n(x[1])}</b><small>current filters</small></div>`).join('')}</div><div class="content-grid"><div class="pub-list" id="contentList">${content.map(pubCard).join('')}</div><aside><div class="side-stat"><h3>Theme coverage</h3><p>Coverage recalculates from exactly the same filters as the content list.</p>${[['IntraWeb 17 FE',50],['Tutorials',33],['Release notes',17]].map(x=>`<div class="coverage-row"><div class="row"><b>${x[0]}</b><small>${x[1]}%</small></div><div class="track"><i style="width:${x[1]}%"></i></div></div>`).join('')}</div><div class="side-stat"><h3>Input → Output</h3><p>Every publication keeps planned CMS metadata separately from measured provider results and metric history.</p></div></aside></div>`}function pubCard(x){return `<article class="pub-card" data-theme="${x.theme}" data-channels="${x.channels.join(',')}"><div class="pub-main"><section class="pub-input"><div class="kicker"><span class="status ${x.status}">${x.status}</span><span class="tag">${fmt[x.format]}</span>${x.channels.map(badge).join('')}</div><h3>${x.title}</h3><p>${x.body}</p><div class="meta"><span class="meta-chip">Theme · ${x.theme}</span><span class="meta-chip">Duration · ${x.duration}</span><span class="meta-chip">Date · ${dd(x.date)}</span><span class="meta-chip">Media · linked reference</span></div></section><section class="pub-output">${x.out?`<div class="eyebrow" style="margin-bottom:8px">OUTPUT</div><div class="output-grid">${[['Views',x.out.views],['Reach',x.out.reach],['Likes',x.out.likes],['Comments',x.out.comments],['Shares',x.out.shares],['Watch min',x.out.watch]].map(y=>`<div class="out"><span>${y[0]}</span><b>${n(y[1])}</b></div>`).join('')}</div>`:'<div style="font-size:9px;color:var(--muted);padding:28px 0">Output metrics appear after publication.</div>'}</section></div></article>`}
function monday(v){const x=new Date(v),z=(x.getDay()+6)%7;x.setDate(x.getDate()-z);x.setHours(0,0,0,0);return x}function calCard(x,p){return `<div class="cal-card ${p}">${badge(p)}<b>${x.title}</b><span>${tt(x.date)} · ${fmt[x.format]}</span></div>`}function calendar(){const base=new Date('2026-08-10T12:00:00'),entries=[];content.forEach(x=>x.channels.forEach(p=>entries.push({x,p,when:new Date(x.date)})));let body='';if(cal==='month'){const first=new Date(2026,7,1),start=monday(first),days=[];for(let i=0;i<42;i++){const z=new Date(start);z.setDate(start.getDate()+i);days.push(z)}body=`<div class="calendar-grid">${days.map(z=>`<div class="day"><div class="daydate">${z.toLocaleString('en-US',{month:'short',day:'numeric'})}</div>${entries.filter(e=>e.when.toDateString()===z.toDateString()).map(e=>calCard(e.x,e.p)).join('')}</div>`).join('')}</div>`}else if(cal==='week'){const start=monday(base),days=[];for(let i=0;i<7;i++){const z=new Date(start);z.setDate(start.getDate()+i);days.push(z)}body=`<div class="week">${days.map(z=>`<div class="day"><div class="daydate">${z.toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric'})}</div>${entries.filter(e=>e.when.toDateString()===z.toDateString()).map(e=>calCard(e.x,e.p)).join('')||'<span style="font-size:8px;color:var(--muted)">No posts</span>'}</div>`).join('')}</div>`}else{const list=entries.filter(e=>e.when.toDateString()===base.toDateString());body=`<div class="day-view">${list.map(e=>`<div class="time-row"><time>${tt(e.when)}</time>${calCard(e.x,e.p)}</div>`).join('')||'<div class="panel">No content scheduled today.</div>'}</div>`}return head('Content calendar','Month, week and day views. Every destination has its own visual identity.','<span class="pill accent">16 destination cards</span>')+`<div class="calendar-toolbar"><div class="switch">${['month','week','day'].map(v=>`<button data-cal="${v}" class="${cal===v?'active':''}">${v[0].toUpperCase()+v.slice(1)}</button>`).join('')}</div><div class="legend">${Object.keys(providers).map(badge).join('')}</div></div>${body}`}
function publisher(){let base=pubChannel==='all'?content:content.filter(x=>x.channels.includes(pubChannel));let list=pubStatus==='all'?base:base.filter(x=>x.status===pubStatus);return head('Publisher','The operational queue: review, schedule and publish destination-specific versions.','<span class="pill accent">'+list.length+' visible items</span>')+`<div class="tabs"><button data-pch="all" class="${pubChannel==='all'?'active':''}">All channels</button>${channels.map(c=>`<button data-pch="${c[0]}" class="${pubChannel===c[0]?'active':''}">${badge(c[0])}<span>${c[1]}</span></button>`).join('')}<button disabled>${badge('vk')} future</button><button disabled>${badge('x')} future</button></div><div class="status-tabs">${[['all','All'],['review','Needs review'],['scheduled','Scheduled'],['draft','Drafts'],['published','Published']].map(([v,l])=>`<button data-pst="${v}" class="${pubStatus===v?'active':''}">${l}<span>${v==='all'?base.length:base.filter(x=>x.status===v).length}</span></button>`).join('')}</div><div class="publisher-list">${list.map(x=>`<article class="publisher-row"><div class="publisher-status"><span class="status ${x.status}">${x.status}</span><small>${dd(x.date)} · ${tt(x.date)}</small></div><div><h3>${x.title}</h3><p>${x.body}</p><div class="meta">${(pubChannel==='all'?x.channels:x.channels.filter(p=>p===pubChannel)).map(badge).join('')}<span class="meta-chip">${x.theme}</span><span class="meta-chip">${fmt[x.format]}</span></div></div><div class="publisher-actions">${x.status==='review'?'<button class="primary">Open revision</button>':x.status==='scheduled'?'<button>Edit schedule</button>':x.status==='draft'?'<button>Continue</button>':'<button>View result</button>'}</div></article>`).join('')||'<div class="panel">This queue is empty.</div>'}</div>`}
function knowledgeView(){const list=kb==='all'?knowledge:knowledge.filter(x=>x[0]===kb);return head('Knowledge Base','Catalog of everything we know, with source provenance and source intelligence.','<span class="pill accent">'+knowledge.length+' inputs</span>')+`<div class="filters"><label><span>Source class</span><select id="kb"><option value="all">All sources</option><option value="manual" ${kb==='manual'?'selected':''}>Manual</option><option value="internal" ${kb==='internal'?'selected':''}>Internal parsing</option><option value="external" ${kb==='external'?'selected':''}>External parsing</option></select></label><label class="wide"><span>Search</span><input placeholder="Fact, theme, source, competitor…"></label></div><div class="knowledge-grid"><section class="knowledge">${list.map(x=>`<article class="know-row"><div class="know-top"><div><span class="source-class ${x[0]}">${x[0]}</span><h3>${x[1]}</h3></div><span class="meta-chip">${x[3]}</span></div><p>${x[2]}</p><div class="meta">${x[4].map(t=>`<span class="meta-chip">${t}</span>`).join('')}</div></article>`).join('')}</section><aside class="source-intel"><div class="source-head"><h3>Source intelligence</h3><p>External parsing accumulates its own time-series statistics so we can identify leaders and competitors by theme.</p></div>${[['IntraWeb official site','18 items / 2 themes','+4 this week'],['Developer community watchlist','46 items / 3 themes','+11 this week'],['Framework competitor watch','31 items / 4 themes','+9 this week']].map(x=>`<div class="source-row"><b>${x[0]}</b><small>${x[1]}</small><span class="delta">${x[2]}</span></div>`).join('')}<div class="source-row"><b>Tracked over time</b><small>Items/day · publishing frequency · topic share · engagement · source contribution · competitor momentum.</small></div></aside></div>`}
function hero(){return head('Hero Setup','Workspace intelligence: everything CMS IW needs to understand IntraWeb 17 before creating content.','<span class="pill accent">10 intelligence inputs</span>')+`<div class="hero-grid"><section class="hero-card"><div class="eyebrow">BRAND CORE</div><h2>Project knowledge</h2><p>Official facts, positioning, terminology, audience, preferred claims and prohibited wording.</p><div class="mini-list"><div><b>IntraWeb 17</b><small>Pilot content operation for IntraWeb 17 FE.</small></div><div><b>Style memory</b><small>Learn from owned posts, videos, links and transcripts.</small></div></div></section><section class="hero-card"><div class="eyebrow">OWNED CONTENT</div><h2>What we already published</h2><p>Existing posts/videos/pages become references. CMS stores links and extracted knowledge, not huge media files.</p><div class="mini-list"><div><b>Product voice sample</b><small>Text reference</small></div><div><b>Tutorial transcript sample</b><small>Transcript reference</small></div></div></section><section class="hero-card"><div class="eyebrow">WATCHLIST</div><h2>Sources to learn from</h2><p>Own sites, external channels, news, competitors and future collectors.</p><div class="mini-list"><div><b>IntraWeb official site</b><small>Internal parser · priority 100</small></div><div><b>Developer community</b><small>External collector · priority 80</small></div></div></section><section class="hero-card"><div class="eyebrow">CONTENT DNA</div><h2>Creation defaults</h2><p>Reusable instructions for text, images, audio, shorts and long-form video modules.</p><div class="mini-list"><div><b>Short-form structure</b><small>Hook → proof → practical result → CTA</small></div><div><b>Long-form structure</b><small>Problem → workflow → explanation → caveats</small></div></div></section><section class="hero-card full"><div class="eyebrow">INGEST</div><h2>Add workspace intelligence</h2><div class="drop">Paste a URL, text, transcript, channel, document reference or data source. References and extracted knowledge stay in CMS IW; large files stay in their original storage.</div></section></div>`}
function settings(){return head('Workspace settings','Connections, dashboard composition, modules and workspace administration.')+`<div class="settings-grid"><section class="settings-card"><h3>Connections</h3><p>Publishing and analytics accounts.</p>${channels.map(c=>`<div class="connection"><div>${badge(c[0])}<b>${c[1]}</b><small>Not connected in UI preview</small></div><span class="status draft">setup</span></div>`).join('')}</section><section class="settings-card"><h3>Dashboard widgets</h3><p>Choose which module summaries appear on Dashboard.</p><div class="widget-toggles">${[['library','Content library'],['queue','Publisher queue'],['views','Views synced'],['knowledge','Knowledge growth'],['coverage','Theme coverage'],['sources','Source activity']].map(x=>`<button data-widget="${x[0]}" class="${widgets.has(x[0])?'active':''}">${x[1]}</button>`).join('')}</div></section><section class="settings-card"><h3>Modules</h3><p>Creation and collection engines remain independently replaceable.</p><div class="mini-list"><div><b>Text / post engine</b><small>enabled</small></div><div><b>Short / Reel engine</b><small>module boundary</small></div><div><b>Long-video engine</b><small>module boundary</small></div><div><b>Audio / voice engines</b><small>open-source adapters supported</small></div><div><b>Knowledge collectors</b><small>module boundary</small></div></div></section><section class="settings-card"><h3>Workspace profile</h3><p>Profile, taxonomy administration and publishing safeguards.</p><div class="mini-list"><div><b>IntraWeb 17</b><small>Pilot workspace</small></div><div><b>Safe publishing</b><small>Preview does not call any real social network.</small></div></div></section></div>`}
function render(){nav();view.innerHTML=current==='content'?contentView():current==='calendar'?calendar():current==='publisher'?publisher():current==='knowledge'?knowledgeView():current==='hero'?hero():current==='settings'?settings():dashboard();document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{current=b.dataset.open;render()});document.querySelectorAll('[data-cal]').forEach(b=>b.onclick=()=>{cal=b.dataset.cal;render()});document.querySelectorAll('[data-pch]').forEach(b=>b.onclick=()=>{pubChannel=b.dataset.pch;render()});document.querySelectorAll('[data-pst]').forEach(b=>b.onclick=()=>{pubStatus=b.dataset.pst;render()});if(document.getElementById('kb'))kb.onchange=e=>{kb=e.target.value;render()};document.querySelectorAll('[data-widget]').forEach(b=>b.onclick=()=>{widgets.has(b.dataset.widget)?widgets.delete(b.dataset.widget):widgets.add(b.dataset.widget);localStorage.setItem('cms-preview-widgets',JSON.stringify([...widgets]));render()});if(document.getElementById('configDash'))configDash.onclick=()=>{current='settings';render()};if(document.getElementById('channelFilter'))channelFilter.onchange=applyContentFilters;if(document.getElementById('themeFilter'))themeFilter.onchange=applyContentFilters;if(document.getElementById('q'))q.oninput=applyContentFilters}function applyContentFilters(){const c=document.getElementById('channelFilter')?.value||'all',t=document.getElementById('themeFilter')?.value||'all',qv=(document.getElementById('q')?.value||'').toLowerCase();document.querySelectorAll('.pub-card').forEach(card=>{const okc=c==='all'||card.dataset.channels.split(',').includes(c),okt=t==='all'||card.dataset.theme===t,okq=!qv||card.textContent.toLowerCase().includes(qv);card.classList.toggle('hidden',!(okc&&okt&&okq))})}heroBtn.onclick=()=>{current='hero';render()};profileBtn.onclick=settingsRail.onclick=()=>{current='settings';render()};render();
</script></body></html>
