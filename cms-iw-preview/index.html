<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CMS IW — UI Preview</title>
<style>
:root{
  --body:16pt;--compact:14pt;--h3:18pt;--h2:22pt;--h1:34pt;--display:42pt;
  --ink:#151717;--muted:#676e69;--canvas:#e9ece8;--surface:#f8faf7;--white:#fff;--graphite:#202321;
  --line:#d9ddd8;--line2:#c8cdc7;--accent:#b7ff3c;--accent-soft:#e6ffc1;--danger:#c95c54;
  --r1:10px;--r2:14px;--r3:18px;--r4:26px;--shadow:0 18px 50px rgba(23,27,24,.08)
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:var(--body);line-height:1.45;color:var(--ink);background:var(--canvas)}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}h1{font-size:var(--h1);line-height:1.04;margin:0;letter-spacing:-.045em}h2{font-size:var(--h2);line-height:1.15;margin:0}h3{font-size:var(--h3);line-height:1.2;margin:0}p{margin:0;color:var(--muted)}
.pill,.tag,.badge,.provider,.status,.chip,.count{font-size:var(--compact);line-height:1.15}.pill,.tag,.badge,.provider,.status,.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:6px 9px;background:#fff}.pill.accent{background:var(--accent-soft)}.status.published{background:#e5f8cf;color:#3e6225}.status.scheduled{background:#e9f2ff;color:#315f91}.status.review{background:#fff2d4;color:#805d08}.status.draft{background:#eff1ef}.status.failed{background:#ffe8e5;color:#973e37}.provider.youtube{background:#fff0f1;color:#c51b1b}.provider.linkedin{background:#edf5ff;color:#0a66c2}.provider.tiktok{background:#ececec;color:#111}.provider.instagram{background:#fff0fa;color:#a52a77}.provider.facebook{background:#eef3ff;color:#2854b9}.provider.telegram{background:#eef8ff;color:#2481cc}.provider.vk{background:#edf5ff;color:#07f}.provider.x{background:#111;color:#fff}
.app{min-height:100vh;display:grid;grid-template-columns:78px 360px minmax(0,1fr)}.rail{position:sticky;top:0;height:100vh;background:#171918;color:#fff;padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:10px}.mark{width:54px;height:54px;border-radius:16px;background:var(--accent);color:#111;display:grid;place-items:center;font-weight:900}.rail-nav{display:grid;gap:10px;width:100%}.rail-btn{width:54px;height:54px;border:0;border-radius:14px;background:transparent;color:#a8aea9;display:grid;place-items:center;font-size:18pt}.rail-btn:hover,.rail-btn.active{background:#303430;color:var(--accent)}.spacer{flex:1}.sidebar{position:sticky;top:0;height:100vh;overflow:auto;background:rgba(248,250,247,.82);border-right:1px solid var(--line2);padding:26px 22px;display:flex;flex-direction:column}.workspace-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.eyebrow{font-size:var(--body);font-weight:800;letter-spacing:.08em;color:#858c86;text-transform:uppercase}.workspace-name{font-size:20pt;font-weight:850;letter-spacing:-.03em;margin-top:5px}.dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px rgba(183,255,60,.18)}.hero-link{width:100%;min-height:74px;border:1px solid rgba(150,205,54,.5);background:linear-gradient(135deg,rgba(183,255,60,.18),#fff);border-radius:16px;padding:13px;display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;margin-bottom:26px}.hero-icon{width:42px;height:42px;border-radius:12px;background:#191b1a;color:var(--accent);display:grid;place-items:center}.section-title{font-weight:850;color:#858c86;text-transform:uppercase;letter-spacing:.06em;margin:0 8px 9px}.nav{display:grid;gap:6px}.nav button{min-height:56px;border:0;border-radius:13px;background:transparent;text-align:left;padding:11px 13px;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:center;font-weight:700}.nav button:hover,.nav button.active{background:#e3e7e2}.nav button.active{box-shadow:inset 4px 0 var(--accent)}.profile{margin-top:auto;width:100%;min-height:76px;border:1px solid var(--line2);background:#fff;border-radius:16px;padding:12px;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left}.avatar{width:44px;height:44px;border-radius:50%;background:#202321;color:var(--accent);display:grid;place-items:center;font-weight:900}.main{min-width:0}.topbar{position:sticky;top:0;z-index:5;min-height:88px;border-bottom:1px solid var(--line2);background:rgba(233,236,232,.9);backdrop-filter:blur(18px);padding:14px 32px;display:flex;justify-content:space-between;align-items:center;gap:20px}.crumbs{display:flex;gap:9px;color:#858c86}.crumbs b{color:var(--ink)}.top-actions{display:flex;gap:10px}.btn{min-height:54px;border:1px solid var(--line2);background:#fff;border-radius:14px;padding:0 16px;font-weight:800}.btn.primary{background:var(--accent);border-color:#a8df4b}.btn.dark{background:#202321;color:#fff}.view{max-width:1600px;margin:auto;padding:34px 34px 70px}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:22px;margin-bottom:26px}.page-head p{max-width:850px;margin-top:10px}.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.widgets,.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}.widget,.kpi,.panel,.card{background:var(--surface);border:1px solid var(--line2);border-radius:var(--r3);box-shadow:var(--shadow)}.widget,.kpi{padding:20px}.widget span,.kpi span{color:var(--muted)}.widget b,.kpi b{display:block;font-size:var(--display);line-height:1;margin:12px 0 7px;letter-spacing:-.05em}.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.panel{padding:22px}.panel.dark{background:var(--graphite);color:#fff}.panel.dark p{color:#b2b8b3}.panel-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}.queue-row{padding:16px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;align-items:center}.panel.dark .queue-row{border-color:#3d413e}.coverage-row{margin-top:16px}.coverage-top{display:flex;justify-content:space-between;gap:10px}.track{height:9px;background:#3b403c;border-radius:999px;overflow:hidden;margin-top:8px}.track i{display:block;height:100%;background:var(--accent);border-radius:999px}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end;padding:16px;background:#f7f9f6;border:1px solid var(--line2);border-radius:17px;margin-bottom:14px}.filters label{display:grid;gap:7px;min-width:190px}.filters label.wide{flex:1 1 310px}.filters input,.filters select{min-height:54px;border:1px solid var(--line2);border-radius:12px;background:#fff;padding:0 13px}.kpis{grid-template-columns:repeat(5,minmax(0,1fr))}.content-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(320px,.7fr);gap:14px}.pub-list{display:grid;gap:12px}.pub-card{border:1px solid var(--line2);border-radius:18px;background:#fff;overflow:hidden}.pub-main{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,.8fr)}.pub-input,.pub-output{padding:24px}.pub-output{border-left:1px solid var(--line);background:#f8faf7}.pub-card h3{margin:10px 0 8px}.pub-card p{margin-bottom:12px}.output-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.out{border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px}.out b{display:block;font-size:22pt;margin-top:5px}.side-stat{background:#1b1d1c;color:#fff;border-radius:18px;padding:20px;margin-bottom:12px}.side-stat p{color:#afb5b0;margin-top:7px}
.calendar-toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}.switch{display:flex;gap:4px;border:1px solid var(--line2);border-radius:13px;padding:4px;background:#f7f9f6}.switch button{min-height:48px;border:0;background:transparent;border-radius:10px;padding:0 14px}.switch button.active{background:#1c1e1d;color:#fff}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(230px,1fr));border:1px solid var(--line2);border-radius:18px;overflow:auto;background:#fff}.day{min-width:230px;min-height:195px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px}.day:nth-child(7n){border-right:0}.daydate{color:var(--muted);margin-bottom:10px}.cal-card{border-left:5px solid #999;border-radius:11px;padding:11px;margin-bottom:9px;background:#f4f5f3}.cal-card b{display:block;margin:7px 0 4px}.cal-card.youtube{border-left-color:#ff0033;background:#fff1f3}.cal-card.linkedin{border-left-color:#0a66c2;background:#edf5ff}.cal-card.tiktok{border-left-color:#111;background:#eee}.cal-card.instagram{border-left-color:#c13584;background:#fff0fa}.cal-card.facebook{border-left-color:#1877f2;background:#eef3ff}.cal-card.telegram{border-left-color:#229ed9;background:#eef8ff}.cal-card.vk{border-left-color:#07f;background:#edf5ff}.cal-card.x{border-left-color:#111;background:#ededed}.week{display:grid;grid-template-columns:repeat(7,minmax(230px,1fr));gap:10px;overflow:auto}.week .day{border:1px solid var(--line2);border-radius:16px}.day-view{display:grid;gap:12px}.time-row{display:grid;grid-template-columns:100px minmax(0,1fr);gap:14px;align-items:start}
.tabs,.status-tabs{display:flex;gap:9px;overflow:auto;padding-bottom:10px;margin-bottom:12px}.tabs button,.status-tabs button{min-height:52px;border:1px solid var(--line2);background:#fff;border-radius:13px;padding:0 12px;display:flex;align-items:center;gap:8px;white-space:nowrap}.tabs button.active,.status-tabs button.active{background:#202321;color:#fff}.publisher-list{display:grid;gap:12px}.publisher-row{display:grid;grid-template-columns:190px minmax(0,1fr) auto;gap:18px;align-items:center;border:1px solid var(--line2);border-radius:18px;background:#fff;padding:22px}.publisher-row h3{margin-bottom:7px}.publisher-row p{margin-bottom:10px}.publisher-actions{display:flex;gap:8px;flex-wrap:wrap}
.knowledge-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(340px,.7fr);gap:14px}.knowledge,.source-intel{background:#fff;border:1px solid var(--line2);border-radius:18px;overflow:hidden}.know-row,.source-row,.source-head{padding:20px;border-bottom:1px solid var(--line)}.know-row:last-child,.source-row:last-child{border-bottom:0}.know-top{display:flex;justify-content:space-between;gap:14px;align-items:start}.know-row h3{margin:8px 0}.source-row p{margin-top:6px}.hero-grid,.settings-grid,.ds-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.hero-card,.settings-card,.ds-card{background:#fff;border:1px solid var(--line2);border-radius:18px;padding:22px}.hero-card.full,.ds-card.full{grid-column:1/-1}.hero-card p,.settings-card p,.ds-card p{margin-top:8px}.stack{display:grid;gap:12px;margin-top:14px}.stack>div{border:1px solid var(--line);border-radius:13px;padding:14px;background:#fafbfa}.settings-card .provider-row{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}.ds-swatch{min-height:110px;border-radius:15px;border:1px solid var(--line);padding:14px;display:flex;align-items:end}.empty{padding:24px;color:var(--muted);text-align:center}
@media(max-width:1250px){.app{grid-template-columns:72px 320px minmax(0,1fr)}.widgets,.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.content-grid,.knowledge-grid{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.publisher-row{grid-template-columns:1fr}.pub-main{grid-template-columns:1fr}.pub-output{border-left:0;border-top:1px solid var(--line)}}
@media(max-width:850px){.app{grid-template-columns:68px minmax(0,1fr)}.sidebar{display:none}.view{padding:24px 18px 50px}.topbar{padding:12px 18px}.page-head{align-items:flex-start;flex-direction:column}.widgets,.kpis,.hero-grid,.settings-grid,.ds-grid{grid-template-columns:1fr}.filters{display:grid}.filters label,.filters label.wide{min-width:0;width:100%}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail"><div class="mark">IW</div><div id="railNav" class="rail-nav"></div><div class="spacer"></div><button class="rail-btn" data-route="settings" title="Settings">⚙</button></aside>
  <aside class="sidebar">
    <div class="workspace-head"><div><div class="eyebrow">CONTENT SYSTEM</div><div class="workspace-name">IntraWeb 17</div></div><span class="dot"></span></div>
    <button class="hero-link" data-route="hero"><span class="hero-icon">✦</span><span><b>Hero Setup</b><br>Workspace intelligence</span><span>›</span></button>
    <div class="section-title">Workspace</div><nav id="sideNav" class="nav"></nav>
    <button class="profile" data-route="settings"><span class="avatar">N</span><span><b>Profile</b><br>Workspace administrator</span><span>›</span></button>
  </aside>
  <main class="main"><header class="topbar"><div class="crumbs"><span>CMS IW</span><span>/</span><b id="crumb">Dashboard</b></div><div class="top-actions"><button class="btn">⌕ Search</button><button class="btn primary">＋ New content</button></div></header><section id="view" class="view"></section></main>
</div>
<script>
const navDefs=[['dashboard','⌂','Dashboard'],['content','▤','Content & Analytics'],['calendar','□','Calendar'],['publisher','↑','Publisher'],['knowledge','◇','Knowledge Base']];
const providers={youtube:['▶','YouTube'],linkedin:['in','LinkedIn'],tiktok:['♪','TikTok'],instagram:['◎','Instagram'],facebook:['f','Facebook'],telegram:['➤','Telegram'],vk:['VK','VK'],x:['X','X']};
const content=[
 {title:'IntraWeb 17 FE — first look',theme:'IntraWeb 17 FE',format:'Long video',provider:'youtube',status:'published',date:'2026-08-06',duration:'06:42',views:4830,reach:8120,likes:247,comments:31,shares:36},
 {title:'Responsive forms in 60 seconds',theme:'Tutorials',format:'Short',provider:'tiktok',status:'scheduled',date:'2026-08-12',duration:'00:58',views:0,reach:0,likes:0,comments:0,shares:0},
 {title:'IntraWeb 17 weekly update',theme:'Release notes',format:'Post',provider:'linkedin',status:'review',date:'2026-08-11',duration:'—',views:0,reach:0,likes:0,comments:0,shares:0},
 {title:'Rendering performance explained',theme:'Performance',format:'Image post',provider:'facebook',status:'draft',date:'2026-08-14',duration:'—',views:0,reach:0,likes:0,comments:0,shares:0},
 {title:'Migration checklist',theme:'How-to / snippets',format:'Post',provider:'x',status:'published',date:'2026-08-05',duration:'—',views:1680,reach:3920,likes:104,comments:15,shares:29},
 {title:'Customer project showcase',theme:'Customer showcase',format:'Video',provider:'vk',status:'scheduled',date:'2026-08-15',duration:'02:18',views:0,reach:0,likes:0,comments:0,shares:0}
];
let route=location.hash.replace('#/','')||'dashboard',calView='month',publisherProvider='all',filterProvider='all',filterTheme='all';
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge=p=>`<span class="provider ${p}">${providers[p]?.[0]||p} ${providers[p]?.[1]||p}</span>`;
function bindRoutes(){document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{location.hash='#/'+b.dataset.route})}
function renderNav(){$('#railNav').innerHTML=navDefs.map(([r,i,l])=>`<button class="rail-btn ${route===r?'active':''}" data-route="${r}" title="${l}">${i}</button>`).join('');$('#sideNav').innerHTML=navDefs.map(([r,i,l])=>`<button class="${route===r?'active':''}" data-route="${r}"><span>${i}</span><span>${l}</span></button>`).join('');$('#crumb').textContent=({dashboard:'Dashboard',content:'Content & Analytics',calendar:'Calendar',publisher:'Publisher',knowledge:'Knowledge Base',hero:'Hero Setup',settings:'Settings'})[route]||'Dashboard';bindRoutes()}
const head=(t,p,m='')=>`<div class="page-head"><div><h1>${t}</h1><p>${p}</p></div>${m?`<div class="meta">${m}</div>`:''}</div>`;
function dashboard(){return `${head('Dashboard','A configurable workspace overview assembled from module widgets.','<span class="pill accent">IntraWeb 17</span>')}<div class="widgets"><div class="widget"><span>Published this month</span><b>18</b><p>All channels</p></div><div class="widget"><span>Scheduled</span><b>11</b><p>Next 30 days</p></div><div class="widget"><span>Total views</span><b>48K</b><p>Current period</p></div><div class="widget"><span>Knowledge items</span><b>326</b><p>Manual + parsed</p></div></div><div class="grid2"><section class="panel"><div class="panel-head"><div><h2>Upcoming queue</h2><p>Cross-channel content scheduled next.</p></div><button class="btn" data-route="publisher">Open Publisher</button></div>${content.filter(x=>x.status==='scheduled'||x.status==='review').map(x=>`<div class="queue-row"><div><b>${esc(x.title)}</b><p>${x.theme} · ${x.date}</p></div>${badge(x.provider)}</div>`).join('')}</section><section class="panel dark"><h2>Theme coverage</h2><p>Current month, based on published content.</p>${[['Tutorials',38],['Release notes',24],['Performance',18],['Customer showcase',12]].map(([n,v])=>`<div class="coverage-row"><div class="coverage-top"><b>${n}</b><span>${v}%</span></div><div class="track"><i style="width:${v}%"></i></div></div>`).join('')}</section></div>`}
function pubCard(x){return `<article class="pub-card"><div class="pub-main"><div class="pub-input"><div class="meta"><span class="status ${x.status}">${x.status}</span><span class="tag">${x.format}</span>${badge(x.provider)}</div><h3>${esc(x.title)}</h3><p>Canonical content metadata and links live here. Media itself is referenced, not stored as the primary binary in CMS IW.</p><div class="meta"><span class="chip">Theme · ${x.theme}</span><span class="chip">Duration · ${x.duration}</span><span class="chip">Date · ${x.date}</span></div></div><div class="pub-output">${x.status==='published'?`<div class="eyebrow">OUTPUT</div><div class="output-grid"><div class="out"><span>Views</span><b>${x.views.toLocaleString()}</b></div><div class="out"><span>Reach</span><b>${x.reach.toLocaleString()}</b></div><div class="out"><span>Likes</span><b>${x.likes}</b></div><div class="out"><span>Shares</span><b>${x.shares}</b></div></div>`:'<div class="empty">Output appears after publication.</div>'}</div></div></article>`}
function contentPage(){const themes=[...new Set(content.map(x=>x.theme))],filtered=content.filter(x=>(filterProvider==='all'||x.provider===filterProvider)&&(filterTheme==='all'||x.theme===filterTheme));const pub=filtered.filter(x=>x.status==='published');const views=pub.reduce((a,x)=>a+x.views,0),reach=pub.reduce((a,x)=>a+x.reach,0);return `${head('Content & Analytics','One filtered dataset drives both publication history and analytics.','<span class="pill accent">'+filtered.length+' records</span>')}<div class="filters"><label class="wide"><span>Search</span><input placeholder="Title, theme, structure, campaign…"></label><label><span>Period</span><select><option>Any period</option><option>7 days</option><option>30 days</option><option>January 2026</option></select></label><label><span>Channel</span><select id="fProvider"><option value="all">All channels</option>${Object.entries(providers).map(([p,v])=>`<option value="${p}" ${filterProvider===p?'selected':''}>${v[1]}</option>`).join('')}</select></label><label><span>Theme</span><select id="fTheme"><option value="all">All themes</option>${themes.map(t=>`<option ${filterTheme===t?'selected':''}>${t}</option>`).join('')}</select></label><label><span>Format</span><select><option>All formats</option><option>Post</option><option>Short</option><option>Long video</option></select></label></div><div class="kpis"><div class="kpi"><span>Published posts</span><b>${pub.length}</b><p>current filters</p></div><div class="kpi"><span>Views</span><b>${views.toLocaleString()}</b><p>current filters</p></div><div class="kpi"><span>Reach</span><b>${reach.toLocaleString()}</b><p>current filters</p></div><div class="kpi"><span>Likes</span><b>${pub.reduce((a,x)=>a+x.likes,0)}</b><p>current filters</p></div><div class="kpi"><span>Shares</span><b>${pub.reduce((a,x)=>a+x.shares,0)}</b><p>current filters</p></div></div><div class="content-grid"><div class="pub-list">${filtered.map(pubCard).join('')}</div><aside><div class="side-stat"><h3>Theme coverage</h3><p>Share of published items in the exact filtered set.</p>${themes.slice(0,4).map((t,i)=>`<div class="coverage-row"><div class="coverage-top"><b>${t}</b><span>${[38,24,18,12][i]}%</span></div><div class="track"><i style="width:${[38,24,18,12][i]}%"></i></div></div>`).join('')}</div></aside></div>`}
function calCard(x){return `<div class="cal-card ${x.provider}">${badge(x.provider)}<b>${esc(x.title)}</b><span>${x.date} · ${x.format}</span></div>`}
function calendarPage(){let body='';if(calView==='month'){const days=Array.from({length:35},(_,i)=>i+1);body=`<div class="calendar-grid">${days.map(d=>`<div class="day"><div class="daydate">Aug ${d}</div>${content.filter(x=>Number(x.date.slice(-2))===d).map(calCard).join('')}</div>`).join('')}</div>`}else if(calView==='week'){body=`<div class="week">${['Mon 10','Tue 11','Wed 12','Thu 13','Fri 14','Sat 15','Sun 16'].map((d,i)=>`<div class="day"><div class="daydate">${d}</div>${content.filter(x=>Number(x.date.slice(-2))===10+i).map(calCard).join('')||'<div class="empty">No posts</div>'}</div>`).join('')}</div>`}else{body=`<div class="day-view">${content.slice(0,3).map((x,i)=>`<div class="time-row"><b>${['10:00','12:30','16:00'][i]}</b>${calCard(x)}</div>`).join('')}</div>`}return `${head('Content calendar','Provider identity is visible immediately. Calendar expands to Month, Week and Day.','<span class="pill accent">Month / Week / Day</span>')}<div class="calendar-toolbar"><div class="switch">${['month','week','day'].map(v=>`<button data-cal="${v}" class="${calView===v?'active':''}">${v[0].toUpperCase()+v.slice(1)}</button>`).join('')}</div><div class="meta">${Object.keys(providers).map(badge).join('')}</div></div>${body}`}
function publisherPage(){const filtered=publisherProvider==='all'?content:content.filter(x=>x.provider===publisherProvider);return `${head('Publisher','Operational queue by destination: revision, scheduling, failures and publishing.','<span class="pill accent">'+filtered.length+' queue items</span>')}<div class="tabs"><button data-pub="all" class="${publisherProvider==='all'?'active':''}">All</button>${Object.keys(providers).map(p=>`<button data-pub="${p}" class="${publisherProvider===p?'active':''}">${badge(p)}</button>`).join('')}</div><div class="status-tabs"><button class="active">All <span class="count">${filtered.length}</span></button><button>Needs review <span class="count">${filtered.filter(x=>x.status==='review').length}</span></button><button>Scheduled <span class="count">${filtered.filter(x=>x.status==='scheduled').length}</span></button><button>Draft <span class="count">${filtered.filter(x=>x.status==='draft').length}</span></button><button>Published <span class="count">${filtered.filter(x=>x.status==='published').length}</span></button></div><div class="publisher-list">${filtered.map(x=>`<article class="publisher-row"><div><span class="status ${x.status}">${x.status}</span><p>${x.date}</p></div><div><h3>${esc(x.title)}</h3><p>${x.theme} · ${x.format} · ${x.duration}</p><div class="meta">${badge(x.provider)}<span class="chip">${x.theme}</span></div></div><div class="publisher-actions"><button class="btn">Preview</button><button class="btn ${x.status==='review'?'primary':''}">${x.status==='review'?'Open revision':x.status==='scheduled'?'Edit schedule':x.status==='published'?'View result':'Continue'}</button></div></article>`).join('')}</div>`}
function knowledgePage(){return `${head('Knowledge Base','Catalog of workspace knowledge and external intelligence with provenance and source dynamics.','<span class="pill accent">326 knowledge items</span>')}<div class="filters"><label class="wide"><span>Search knowledge</span><input placeholder="Theme, source, fact, competitor…"></label><label><span>Source class</span><select><option>All</option><option>Manual</option><option>Internal parsing</option><option>External parsing</option></select></label><label><span>Theme</span><select><option>All themes</option><option>Tutorials</option><option>Performance</option><option>Release notes</option></select></label></div><div class="knowledge-grid"><section class="knowledge">${[['manual','Responsive layout guidelines','Entered by team · Tutorials'],['internal','IntraWeb 17 FE release notes','Parsed from official workspace data'],['external','Competitor channel: Delphi productivity','External channel · 18 items this week'],['external','Web framework news watch','External sources · 42 items this week']].map(([c,t,p])=>`<article class="know-row"><div class="know-top"><div><span class="badge">${c}</span><h3>${t}</h3><p>${p}</p></div><span class="pill">Open</span></div></article>`).join('')}</section><aside class="source-intel"><div class="source-head"><h3>Source intelligence</h3><p>Activity and contribution over time.</p></div>${[['Official IntraWeb','94 items · +8 this week'],['Developer community','71 items · +14 this week'],['Competitor A','56 items · +19 this week'],['Industry news','105 items · +31 this week']].map(([n,p])=>`<div class="source-row"><b>${n}</b><p>${p}</p></div>`).join('')}</aside></div>`}
function heroPage(){return `${head('Hero Setup','The central workspace intelligence setup: everything the system should know about this project.','<span class="pill accent">Workspace context</span>')}<div class="hero-grid"><section class="hero-card"><div class="eyebrow">BRAND & PRODUCT</div><h2>Core knowledge</h2><p>Official site, product facts, terminology, positioning and prohibited wording.</p><div class="stack"><div><b>IntraWeb official website</b><p>Primary product reference</p></div><div><b>IntraWeb 17 FE documentation</b><p>Product and release knowledge</p></div></div></section><section class="hero-card"><div class="eyebrow">VOICE & AUDIENCE</div><h2>Communication profile</h2><p>Audience, preferred tone, representative posts, transcripts and content examples.</p><div class="stack"><div><b>Developer audience</b><p>Practical, technical, result-focused</p></div><div><b>Reference publications</b><p>26 examples linked</p></div></div></section><section class="hero-card full"><div class="eyebrow">SOURCES</div><h2>What Hero can learn from</h2><p>Manual input, workspace parsing and external references all feed reusable workspace context without becoming publishing logic.</p><div class="meta" style="margin-top:14px"><span class="pill">Websites</span><span class="pill">Social channels</span><span class="pill">Published links</span><span class="pill">Texts</span><span class="pill">Transcripts</span><span class="pill">Documents</span><span class="pill">Competitors</span><span class="pill">External sources</span></div></section></div>`}
function settingsPage(){return `${head('Settings','Workspace configuration, connections, profile, modules and the shared design system.','<span class="pill">Workspace settings</span>')}<div class="settings-grid"><section class="settings-card"><h2>Connections</h2><p>Provider accounts are configured here, not in Workspace navigation.</p>${Object.keys(providers).slice(0,6).map(p=>`<div class="provider-row"><span>${badge(p)}</span><button class="btn">Configure</button></div>`).join('')}</section><section class="settings-card"><h2>Dashboard configuration</h2><p>Choose which registered module widgets appear on Dashboard.</p><div class="stack"><div><b>Publishing volume</b><p>Enabled</p></div><div><b>Theme coverage</b><p>Enabled</p></div><div><b>Knowledge growth</b><p>Enabled</p></div><div><b>Channel performance</b><p>Enabled</p></div></div></section><section class="ds-card full"><div class="eyebrow">DESIGN SYSTEM</div><h2>Typography & primitives</h2><p>Every interface element must come from this shared system. Regular UI text is never below 16pt. Only compact tags, pills and badges may use 14pt.</p><div class="ds-grid" style="margin-top:16px"><div class="ds-card"><h3>Controls</h3><div class="stack"><button class="btn primary">Primary action</button><button class="btn">Secondary action</button><input class="btn" value="Text field · 16pt"></div></div><div class="ds-card"><h3>Semantic chips</h3><div class="meta" style="margin-top:12px"><span class="pill">Pill · 14pt</span><span class="tag">Tag · 14pt</span><span class="status published">Status · 14pt</span>${badge('youtube')}</div></div><div class="ds-card"><h3>Cards</h3><p>KPI, content, publisher, calendar, knowledge, Hero Setup and Settings all reuse the same surface/radius/spacing tokens.</p></div><div class="ds-card"><h3>Provider identity</h3><div class="meta" style="margin-top:12px">${Object.keys(providers).map(badge).join('')}</div></div></div></section></div>`}
function render(){route=location.hash.replace('#/','')||'dashboard';renderNav();const fn={dashboard,content:contentPage,calendar:calendarPage,publisher:publisherPage,knowledge:knowledgePage,hero:heroPage,settings:settingsPage}[route]||dashboard;$('#view').innerHTML=fn();bindRoutes();document.querySelectorAll('[data-cal]').forEach(b=>b.onclick=()=>{calView=b.dataset.cal;render()});document.querySelectorAll('[data-pub]').forEach(b=>b.onclick=()=>{publisherProvider=b.dataset.pub;render()});$('#fProvider')?.addEventListener('change',e=>{filterProvider=e.target.value;render()});$('#fTheme')?.addEventListener('change',e=>{filterTheme=e.target.value;render()})}
window.addEventListener('hashchange',render);render();
</script>
</body>
</html>
