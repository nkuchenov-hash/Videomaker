function queue(rows){const groups=new Map();rows.forEach(x=>{const k=d(x.when);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(x)});return `<section class="queue"><div class="panel-head"><div><h2>Queue</h2><p>Click any item to inspect it.</p></div><span class="pill">${rows.length}</span></div>${[...groups].map(([label,its])=>`<div class="group"><div class="group-title"><b>${label}</b><span>${its.length} items</span></div>${its.map(x=>`<button class="queue-item ${selected===x.id?'active':''}" data-select="${x.id}"><span class="thumb ${x.aspect==='vertical'?'vertical':x.aspect==='square'?'image':''}">${x.type.includes('video')||x.type==='short'||x.type==='reel'?'▶':x.type==='image_post'?'▧':'Aa'}</span><span class="queue-copy"><span class="queue-meta">${badge(x.provider)}<span class="status ${x.status}">${statLabel(x.status)}</span></span><b>${e(x.title)}</b><span class="queue-time">${t(x.when)} · ${formats[x.type]}</span></span></button>`).join('')}</div>`).join('')||'<div class="empty">No matches.</div>'}</section>`}
function media(x){if(x.aspect==='text')return '';return `<div class="media ${x.aspect==='vertical'?'vertical':x.aspect==='square'?'square':''}"><div class="media-art"><span>INTRAWEB 17</span><strong>${e(x.title)}</strong><span>${e(x.theme)}</span></div>${x.type==='long_video'||x.type==='short'||x.type==='reel'?`<button class="play" data-play>▶</button><div class="video-controls"><span>${x.duration}</span><div class="track"><i></i></div></div>`:''}</div>`}
function center(x){let body;if(tab==='copy')body=`<div class="copy-editor"><h2>Destination copy</h2><p>Edit the version prepared for ${providers[x.provider][1]}.</p><textarea id="copyEdit">${e(x.copy)}</textarea><button class="btn primary" data-save-copy>Save local revision</button></div>`;else if(tab==='assets')body=`<div class="assets"><h2>Assets</h2><p>Media stays linked; Publisher works with the destination package.</p><div class="assets-grid"><div class="asset"><b>Primary asset</b><span>${e(x.asset)}</span><span class="tag">${x.aspect}</span></div><div class="asset"><b>Revision</b><span>${x.revision}</span><span class="tag">destination variant</span></div><div class="asset"><b>Copy length</b><span>${x.copy.length} characters</span></div><div class="asset"><b>Workflow state</b><span>${statLabel(x.status)}</span></div></div></div>`;else{const m=x.metrics||{views:0,likes:0,comments:0,shares:0};body=`<article class="social-card"><div class="social-head"><span class="social-avatar">IW</span><div class="account"><b>${x.provider==='telegram'||x.provider==='instagram'||x.provider==='tiktok'||x.provider==='x'?'@intraweb':'IntraWeb'}</b><span>${badge(x.provider)} · ${t(x.when)}</span></div></div><div class="copy">${e(x.copy)}</div>${media(x)}<div class="engagement"><span>Views · ${m.views.toLocaleString()}</span><span>Likes · ${m.likes.toLocaleString()}</span><span>Comments · ${m.comments.toLocaleString()}</span><span>Shares · ${m.shares.toLocaleString()}</span></div></article>`}return `<section class="preview"><div class="preview-head"><div class="preview-tabs"><button data-tab="preview" class="${tab==='preview'?'active':''}">Preview</button><button data-tab="copy" class="${tab==='copy'?'active':''}">Copy</button><button data-tab="assets" class="${tab==='assets'?'active':''}">Assets</button></div>${badge(x.provider)}</div><div class="stage">${body}</div></section>`}
function inspector(x){return `<aside class="inspector"><div class="panel-head"><div><h2>Publication</h2><p>Destination settings and readiness.</p></div><span class="status ${x.status}">${statLabel(x.status)}</span></div><div class="inspector-body"><div class="field"><label for="pubDate">Publication date</label><input id="pubDate" type="date" value="${inputDate(x.when)}"></div><div class="field"><label for="pubTime">Time</label><input id="pubTime" type="time" value="${inputTime(x.when)}"></div><div class="info"><div class="info-row"><span>Channel</span><b>${providers[x.provider][1]}</b></div><div class="info-row"><span>Theme</span><b>${e(x.theme)}</b></div><div class="info-row"><span>Format</span><b>${formats[x.type]}</b></div><div class="info-row"><span>Duration</span><b>${x.duration}</b></div><div class="info-row"><span>Revision</span><b>${x.revision}</b></div><div class="info-row"><span>Asset</span><b>${e(x.asset)}</b></div></div><div class="checklist"><h3>Readiness</h3><div class="check"><i>✓</i><span>Destination variant exists</span></div><div class="check"><i>✓</i><span>Theme and format assigned</span></div><div class="check ${x.asset.includes('Rough')?'warn':''}"><i>${x.asset.includes('Rough')?'!':'✓'}</i><span>${x.asset.includes('Rough')?'Asset needs final check':'Primary asset ready'}</span></div><div class="check ${x.status==='review'?'warn':''}"><i>${x.status==='review'?'!':'✓'}</i><span>${x.status==='review'?'Editorial approval required':'Editorial state cleared'}</span></div></div><div class="actions">${x.status==='published'?'<button class="btn" data-action="duplicate">Duplicate as new draft</button>':`<button class="btn primary" data-action="approve">Approve & schedule</button><div class="row"><button class="btn" data-action="revise">Request revision</button><button class="btn dark" data-action="publish">Publish now</button></div>`}</div><div id="feedback"></div></div></aside>`}
function render(){const rows=filtered();if(!rows.some(x=>x.id===selected))selected=rows[0]?.id||null;const x=rows.find(y=>y.id===selected),a=all();const counts=Object.fromEntries(Object.keys(providers).map(p=>[p,a.filter(x=>x.provider===p).length]));const st={review:a.filter(x=>x.status==='review').length,scheduled:a.filter(x=>x.status==='scheduled').length,today:a.filter(x=>x.when.toDateString()===base.toDateString()&&x.status!=='published').length,published:a.filter(x=>x.status==='published').length,total:a.length};root.innerHTML=`<div class="stats"><div class="stat"><span>Needs review</span><b>${st.review}</b><span>editorial queue</span></div><div class="stat"><span>Scheduled</span><b>${st.scheduled}</b><span>upcoming posts</span></div><div class="stat"><span>Today</span><b>${st.today}</b><span>due today</span></div><div class="stat"><span>Published</span><b>${st.published}</b><span>visible history</span></div><div class="stat"><span>Total queue</span><b>${st.total}</b><span>all destinations</span></div></div><div class="filters"><div class="provider-tabs"><button data-provider="all" class="${provider==='all'?'active':''}">All <span class="count">${a.length}</span></button>${Object.keys(providers).map(p=>`<button data-provider="${p}" class="${provider===p?'active':''}">${badge(p)}<span class="count">${counts[p]}</span></button>`).join('')}</div><div class="searchrow"><input id="search" value="${e(search)}" placeholder="Search title, theme or copy…"><div class="status-tabs">${[['all','All'],['review','Needs review'],['scheduled','Scheduled'],['draft','Drafts'],['published','Published']].map(([s,l])=>`<button data-status="${s}" class="${status===s?'active':''}">${l}</button>`).join('')}</div></div></div>${x?`<div class="workbench">${queue(rows)}${center(x)}${inspector(x)}</div>`:'<div class="empty">No content matches.</div>'}`;bind()}
function updateWhen(){const x=all().find(y=>y.id===selected);const dd=document.getElementById('pubDate')?.value,tt=document.getElementById('pubTime')?.value;if(x&&dd&&tt){overrides.set(x.id,{...(overrides.get(x.id)||{}),when:new Date(`${dd}T${tt}:00`)})}}
function action(a){const x=all().find(y=>y.id===selected);if(!x)return;updateWhen();const cur=overrides.get(x.id)||{};if(a==='approve')overrides.set(x.id,{...cur,status:'scheduled'});if(a==='revise')overrides.set(x.id,{...cur,status:'review',revision:x.revision+1});if(a==='publish')overrides.set(x.id,{...cur,status:'published',metrics:{views:0,likes:0,comments:0,shares:0}});if(a==='duplicate'){const copy={...x,id:'copy-'+Date.now(),status:'draft',when:day(2,10,0),revision:1,title:x.title+' — new version',metrics:null};items.unshift(copy);selected=copy.id}render()}
function bind(){document.querySelectorAll('[data-select]').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.select;tab='preview';render()}));document.querySelectorAll('[data-provider]').forEach(b=>b.addEventListener('click',()=>{provider=b.dataset.provider;render()}));document.querySelectorAll('[data-status]').forEach(b=>b.addEventListener('click',()=>{status=b.dataset.status;render()}));document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;render()}));document.getElementById('search')?.addEventListener('input',e2=>{search=e2.target.value;setTimeout(render,80)});document.querySelector('[data-save-copy]')?.addEventListener('click',()=>{copies.set(selected,document.getElementById('copyEdit').value);tab='preview';render()});document.querySelector('[data-play]')?.addEventListener('click',e2=>{e2.currentTarget.textContent=e2.currentTarget.textContent==='▶'?'Ⅱ':'▶'});document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.action)));document.getElementById('pubDate')?.addEventListener('change',updateWhen);document.getElementById('pubTime')?.addEventListener('change',updateWhen)}render();
</script>
</body></html>
